name: EAS Update on Push

on:
  push:
    branches:
      - main # Agar aapki branch ka naam 'master' hai, to ise 'master' kar dein

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Mini LMS APP/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        working-directory: Mini LMS APP
        run: npm install --legacy-peer-deps

      - name: Run EAS Update
        working-directory: Mini LMS APP
        run: eas update --auto --non-interactive
